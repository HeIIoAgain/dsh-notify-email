name: CI

# 与 README / CHANGELOG 里写的完全一致：
#   npm run check  ->  node --check index.js && node --check smtp.js
#   npm test       ->  node test/run.mjs（起本地假 SMTP，只走 loopback）
#   npm pack --dry-run -> 校验 npm 包里该有的文件都在
# 零运行时依赖，所以不需要 npm install。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 24
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # 没有 package-lock.json，别开 cache（setup-node 会报错）

      - name: Node version
        run: node --version

      - name: Syntax check
        run: npm run check

      - name: Tests (fake SMTP on 127.0.0.1)
        run: npm test

      - name: npm package contents
        run: npm pack --dry-run
